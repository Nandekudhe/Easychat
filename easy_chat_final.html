<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy Chat (No Login)</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-light: #2c2c2c;
            --primary: #d4af37; 
            --text: #e0e0e0;
            --text-muted: #888;
            --border: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        
        /* Home Screen */
        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 1.5rem; }
        .card { background: var(--surface); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
        h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        
        input[type="text"] { width: 100%; padding: 1.2rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 1rem; outline: none; font-size: 1.1rem; text-align: center; }
        input[type="text"]:focus { border-color: var(--primary); }
        
        button { width: 100%; padding: 1.2rem; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-primary { background: var(--primary); color: var(--bg); }
        .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); margin-top: 1rem; }
        
        /* Chat Screen */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #chat-header { background: var(--surface); padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        #status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #4ade80; }
        .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; }
        #chat-code-display { font-family: monospace; font-size: 1.2rem; color: var(--primary); letter-spacing: 1px; font-weight: bold; }
        .leave-btn { color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; }
        
        #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .msg { max-width: 85%; padding: 0.8rem 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: var(--surface-light); border-bottom-right-radius: 2px; }
        .msg.them { align-self: flex-start; background: var(--primary); color: var(--bg); border-bottom-left-radius: 2px; }
        
        .msg-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .file-box { display: inline-block; background: rgba(0,0,0,0.2); padding: 0.8rem; border-radius: 8px; margin-top: 5px; text-decoration: none; color: inherit; border: 1px solid rgba(255,255,255,0.1); word-break: break-all; font-size: 0.85rem;}
        
        /* Clear Input Area */
        #input-area { padding: 1rem; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        
        .input-row { display: flex; gap: 0.5rem; width: 100%; }
        
        /* The File Button */
        #file-btn { background: var(--surface-light); color: var(--text); border: 1px solid var(--border); width: auto; padding: 0 1.2rem; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: normal; }
        
        #input-area input[type="text"] { flex: 1; margin: 0; text-align: left; padding: 1rem; background: var(--bg); border: 1px solid var(--border); }
        
        #send-btn { background: var(--primary); color: var(--bg); width: auto; padding: 0 1.5rem; border-radius: 8px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="home-screen">
        <div class="card">
            <h1>Easy Chat</h1>
            <div class="subtitle">No login. Pure code-based rooms.</div>
            
            <input type="text" id="join-code" placeholder="ENTER 6-LETTER CODE" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="characters">
            <button class="btn-primary" onclick="joinChat()">Join Room</button>
            
            <button class="btn-secondary" onclick="createChat()">Create New Code</button>
        </div>
    </div>

    <div id="chat-screen">
        <div id="chat-header">
            <div class="leave-btn" onclick="leaveChat()">← Leave</div>
            <div id="status-indicator"><div class="dot"></div> Live</div>
            <div id="chat-code-display"></div>
        </div>
        
        <div id="messages"></div>
        
        <div id="input-area">
            <div id="upload-status" style="display:none; color: var(--primary); font-size: 0.85rem; text-align: center;">Uploading file... please wait.</div>
            <div class="input-row">
                <input type="file" id="file-input" class="hidden" onchange="uploadFile()">
                <!-- BIG OBVIOUS FILE BUTTON -->
                <button id="file-btn" onclick="document.getElementById('file-input').click()">
                    📎 File
                </button>
                
                <input type="text" id="msg-input" placeholder="Message..." autocomplete="off">
                
                <button id="send-btn" onclick="sendText()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let myId = localStorage.getItem('ez_id') || ('usr_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('ez_id', myId);
        
        let currentRoom = null;
        let eventSource = null;
        let seenMsgs = new Set();

        function createChat() {
            joinChat(Math.random().toString(36).substring(2, 8).toUpperCase());
        }

        function joinChat(forceCode = null) {
            const code = forceCode || document.getElementById('join-code').value.trim().toUpperCase();
            if (code.length < 3) return alert("Enter a valid code.");
            
            currentRoom = 'easy_chat_app_v3_' + code;
            
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('chat-code-display').innerText = code;
            document.getElementById('messages').innerHTML = ''; 
            seenMsgs.clear();

            // Connect to Ntfy serverless feed
            eventSource = new EventSource(`https://ntfy.sh/${currentRoom}/sse?since=all`);
            eventSource.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.event === 'message' && !seenMsgs.has(data.id)) {
                    seenMsgs.add(data.id);
                    renderMsg(data);
                }
            };
        }

        function leaveChat() {
            if (eventSource) eventSource.close();
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('home-screen').classList.remove('hidden');
        }

        async function sendText() {
            const input = document.getElementById('msg-input');
            const txt = input.value.trim();
            if (!txt) return;
            input.value = ''; 
            
            await fetch(`https://ntfy.sh/${currentRoom}`, {
                method: 'POST',
                body: txt,
                headers: { 'Title': myId }
            });
        }

        async function uploadFile() {
            const fileBox = document.getElementById('file-input');
            const file = fileBox.files[0];
            if (!file) return;
            
            if (file.size > 15 * 1024 * 1024) {
                alert("File too large. Max 15MB.");
                return;
            }

            const status = document.getElementById('upload-status');
            status.style.display = 'block';
            
            try {
                await fetch(`https://ntfy.sh/${currentRoom}`, {
                    method: 'PUT',
                    body: file,
                    headers: { 'Title': myId, 'Filename': encodeURIComponent(file.name), 'Message': 'Sent a file' }
                });
            } catch(e) {
                alert("Upload failed.");
            }
            
            status.style.display = 'none';
            fileBox.value = ''; 
        }

        function renderMsg(data) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            const isMe = data.title === myId;
            div.className = 'msg ' + (isMe ? 'me' : 'them');
            
            let html = '';
            if (data.message && data.message !== 'Sent a file') {
                html += `<div>${data.message.replace(/</g, '&lt;')}</div>`;
            }
            
            if (data.attachment) {
                const att = data.attachment;
                if (att.type && att.type.startsWith('image/')) {
                    html += `<img src="${att.url}" class="msg-img">`;
                } else if (att.type && att.type.startsWith('video/')) {
                    html += `<video src="${att.url}" controls class="msg-img"></video>`;
                }
                html += `<a href="${att.url}" target="_blank" class="file-box">⬇️ ${att.name || 'Download File'}</a>`;
            }
            
            div.innerHTML = html;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
