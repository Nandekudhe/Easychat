<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy Chat</title>
    <!-- Puter.js handles the serverless backend (database) automatically -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #d4af37; /* Warm beige/muted gold */
            --text: #e0e0e0;
            --text-muted: #888;
            --border: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        
        /* Screens */
        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 2rem; }
        .card { background: var(--surface); padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); }
        
        h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: 1px; color: var(--text); margin-bottom: 1.5rem; }
        
        input { width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 1rem; outline: none; font-size: 1rem; text-align: center; }
        input:focus { border-color: var(--primary); }
        
        button { width: 100%; padding: 1rem; border-radius: 8px; border: none; background: var(--text); color: var(--bg); font-weight: 600; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); margin-top: 1rem; }
        
        /* Chat Screen */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #chat-header { background: var(--surface); padding: 1.2rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        #chat-code-display { font-family: monospace; font-size: 1.1rem; color: var(--primary); background: var(--bg); padding: 0.4rem 0.8rem; border-radius: 6px; letter-spacing: 1px; }
        .leave-btn { font-size: 0.9rem; color: var(--text-muted); cursor: pointer; padding: 0.5rem; }
        
        #messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 0.8rem 1rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-bottom-right-radius: 2px; }
        .msg.them { align-self: flex-start; background: var(--primary); color: var(--bg); border-bottom-left-radius: 2px; }
        
        #input-area { padding: 1rem; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 0.5rem; align-items: center; }
        #input-area input { margin-bottom: 0; text-align: left; flex: 1; border: none; background: var(--surface); }
        #input-area button { width: auto; padding: 1rem 1.5rem; background: var(--primary); color: var(--bg); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="home-screen">
        <div class="card">
            <h1>Easy Chat</h1>
            <input type="text" id="join-code" placeholder="ENTER CODE" autocomplete="off" autocorrect="off" autocapitalize="characters">
            <button onclick="joinChat()">Join Chat</button>
            
            <div style="margin: 2rem 0; height: 1px; background: var(--border); position: relative;">
                <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 10px; color: var(--text-muted); font-size: 0.8rem;">OR</span>
            </div>
            
            <button class="btn-secondary" onclick="createChat()">Create New Chat</button>
        </div>
    </div>

    <div id="chat-screen">
        <div id="chat-header">
            <span class="leave-btn" onclick="leaveChat()">← Leave</span>
            <div>Code: <span id="chat-code-display"></span></div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Generate a persistent unique ID for this specific device so it knows which messages are 'me' vs 'them'
        let myUserId = localStorage.getItem('easy_chat_device_id');
        if (!myUserId) {
            myUserId = 'device_' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('easy_chat_device_id', myUserId);
        }

        let currentChatId = null;
        let pollInterval = null;

        async function createChat() {
            // Generate a random 6-character code
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            // Initialize empty array for this chat room in Puter's cloud key-value store
            await puter.kv.set(`easychat_${code}`, []);
            enterChatRoom(code);
        }

        async function joinChat() {
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if (!code) return alert("Please enter a code");
            
            const btn = document.querySelector('#home-screen button');
            btn.innerText = "Joining...";
            
            const exists = await puter.kv.get(`easychat_${code}`);
            btn.innerText = "Join Chat";
            
            if (exists) {
                enterChatRoom(code);
            } else {
                alert("Chat room not found. Check the code.");
            }
        }

        function enterChatRoom(code) {
            currentChatId = code;
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('chat-code-display').innerText = code;
            
            fetchMessages();
            // Poll for new messages every 2 seconds to simulate real-time chat
            pollInterval = setInterval(fetchMessages, 2000); 
        }

        function leaveChat() {
            currentChatId = null;
            clearInterval(pollInterval);
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('join-code').value = '';
            document.getElementById('messages').innerHTML = '';
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            input.value = ''; 
            
            const msgObj = {
                sender: myUserId,
                text: text,
                timestamp: Date.now()
            };

            // 1. Show message instantly on screen
            appendMessage(msgObj);

            // 2. Fetch current cloud history, append, and save back to Puter
            let msgs = await puter.kv.get(`easychat_${currentChatId}`) || [];
            msgs.push(msgObj);
            await puter.kv.set(`easychat_${currentChatId}`, msgs);
        }

        async function fetchMessages() {
            if (!currentChatId) return;
            const msgs = await puter.kv.get(`easychat_${currentChatId}`);
            if (msgs && Array.isArray(msgs)) {
                renderMessages(msgs);
            }
        }

        function renderMessages(msgs) {
            const container = document.getElementById('messages');
            // Only re-render if message count changed to prevent the scroll from jumping
            if (container.children.length === msgs.length) return; 

            container.innerHTML = '';
            msgs.forEach(appendMessage);
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            
            // Assign class based on whether the sender ID matches this device's ID
            div.className = 'msg ' + (msg.sender === myUserId ? 'me' : 'them');
            div.innerText = msg.text;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Allow sending via Enter key
        document.getElementById('msg-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
